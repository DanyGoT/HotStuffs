name: ci
on:
  push:
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Keep the version in step with the local golangci-lint.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - run: make fix lint test race check-deps
      # make fix rewrites files; a rewrite means the commit missed it.
      - run: git diff --exit-code
