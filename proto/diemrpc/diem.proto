edition = "2024";

package diemrpc;

option go_package = "github.com/DanyGoT/HotStuffs/proto/diemrpc";
option features.enforce_naming_style = STYLE_LEGACY;

import "gorums.proto";
import "google/protobuf/empty.proto";
import "proto/diempb/diem.proto";

// The service lives apart from the messages so that importing the messages
// never pulls in Gorums or gRPC.
//
// GORUMS: an RPC name must never equal a message name, or the generated client
// function collides with the generated type — hence ProposalMsg, not Proposal.
// Only one service is allowed per .proto file, and Config, Node, NodeContext
// and ConfigContext are reserved message names.
service Diem {
  rpc Proposal(diempb.ProposalMsg) returns (google.protobuf.Empty) {
    option (gorums.multicast) = true;
  }

  // Unicast: DiemBFT 3.1 sends a vote to the leader of the next round alone,
  // because that leader is the only replica that will propose over the
  // certificate.
  rpc Vote(diempb.VoteMsg) returns (google.protobuf.Empty) {
    option (gorums.unicast) = true;
  }

  rpc Timeout(diempb.TimeoutMsg) returns (google.protobuf.Empty) {
    option (gorums.multicast) = true;
  }
}
