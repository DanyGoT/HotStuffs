version: "2"

run:
  timeout: 5m

linters:
  # These linters report likely defects rather than style, so each finding
  # should be fixed or carry a //nolint comment that says why it is safe.
  enable:
    - asasalint # a []any passed as a single variadic any argument
    - bidichk # bidirectional Unicode control characters in source
    - durationcheck # two time.Duration values multiplied together
    - errorlint # error comparisons and verbs that break on wrapped errors
    - forcetypeassert # unchecked type assertions, which panic on mismatch
    - gocritic # diagnostic checks only; see settings
    - makezero # append to a slice created with a nonzero length
    - nilerr # returning nil after checking that err is non-nil
    - nilnesserr # returning a different, nil error after an err check
    - nolintlint # malformed or unused //nolint directives
    - reassign # reassigning package variables of another package
    - unconvert # unnecessary type conversions
    - wastedassign # assignments whose values are never used
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
      disabled-tags:
        - style
        - performance
        - opinionated
      disabled-checks:
        # A deferred cleanup skipped by an exit in main is harmless: the
        # process exits, which releases what the cleanup would.
        - exitAfterDefer
        # Flags explanatory comments that contain arithmetic or identifiers.
        - commentedOutCode
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    rules:
      # Tests compare errors by identity on purpose, and a failed type
      # assertion in a test fails that test.
      - path: _test\.go
        linters:
          - errorlint
          - forcetypeassert

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
